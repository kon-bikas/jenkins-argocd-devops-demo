apiVersion: v1
kind: Service
metadata:
    name: argocd-server-np
    namespace: argocd
    labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/name: argocd-server-np
        app.kubernetes.io/part-of: argocd
spec:
    selector:
        app.kubernetes.io/name: argocd-server
    type: NodePort
    ports:
        - name: argocd-server-np-port
          protocol: TCP
          port: 8080
          nodePort: 30111
          targetPort: 8080


