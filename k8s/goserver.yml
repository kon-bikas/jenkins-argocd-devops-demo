apiVersion: apps/v1
kind: Deployment
metadata:
    name: goserver-deploy
    namespace: default
    labels:
        app: server-deploy
spec:
    replicas: 2
    selector:
        matchLabels:
            app: go-server
    template:
        metadata:
            labels:
                app: go-server
        spec:
            containers:
                - name: goserver-container
                  image: 138465306868.dkr.ecr.eu-west-3.amazonaws.com/devops/go-server:latest
                  ports:
                      - name: server-port
                        containerPort: 8080
            imagePullSecrets:
                - name: ecr-secret

